name: bayt_alhuroof
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  just_audio: ^0.9.40
  audio_session: ^0.1.21
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  shared_preferences: ^2.3.2
  path_drawing: ^1.0.1
  path_provider: ^2.1.4
  intl: ^0.20.3
  path: ^1.9.1
  just_audio_media_kit: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.12
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/content/scenes/
    - assets/content/tracing/letters/
    - assets/content/tracing/numbers/
    - assets/images/letters/
    - assets/images/words/
    - assets/images/numbers/
    - assets/images/ui/
    - assets/audio/letters/
    - assets/audio/words/
    - assets/audio/numbers/
    - assets/audio/instructions/
    - assets/audio/feedback/
    - assets/audio/sfx/
